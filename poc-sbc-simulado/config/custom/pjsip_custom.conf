; client_uri=sip:tu-numero@tu-trunk.pstn.twilio.com

; ------------------------------------------------------------------------------
; CONTEXTOS DE DIALPLAN
; ------------------------------------------------------------------------------
; Los contextos reales se definen en extensions_custom.conf
; Aqui solo los declaramos para referencia

; from-acs: Llamadas entrantes desde Azure ACS
; from-twilio: Llamadas entrantes desde Twilio/PSTN
; to-acs: Llamadas salientes hacia Azure ACS
; to-twilio: Llamadas salientes hacia PSTN via Twilio
