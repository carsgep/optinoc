; ==============================================================================
; Configuracion PJSIP Custom para PoC SBC Simulado
; ==============================================================================
; Este archivo se incluye en la configuracion de Asterisk/FreePBX
; Simula el comportamiento de un Cisco CUBE para Direct Routing con ACS
; ==============================================================================

; ------------------------------------------------------------------------------
; TRANSPORTE TLS - Para conexion con Azure ACS
; ------------------------------------------------------------------------------
; Azure ACS requiere TLS 1.2 con certificado de CA publica

[transport-tls-acs]
type=transport
protocol=tls
bind=0.0.0.0:5061
; Certificados - Descomentar cuando esten disponibles
; cert_file=/certs/fullchain.pem
; priv_key_file=/certs/privkey.pem
; ca_list_file=/certs/ca-bundle.crt
method=tlsv1_2
; Cipher suites compatibles con Microsoft
; cipher=TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384:TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

; ------------------------------------------------------------------------------
; TRANSPORTE UDP - Para conexion con Twilio
; ------------------------------------------------------------------------------

[transport-udp-twilio]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ------------------------------------------------------------------------------
; ENDPOINT TEMPLATE - Base para trunks
; ------------------------------------------------------------------------------

[endpoint-template](!)
type=endpoint
context=from-pstn
disallow=all
allow=ulaw
allow=alaw
allow=g722
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
; Media encryption para ACS
; media_encryption=sdes
; media_encryption_optimistic=yes

; ------------------------------------------------------------------------------
; TRUNK HACIA AZURE ACS (Direct Routing)
; ------------------------------------------------------------------------------
; ACS no usa autenticacion SIP, solo valida por certificado TLS y FQDN

[acs-trunk]
type=endpoint
transport=transport-tls-acs
context=from-acs
disallow=all
allow=ulaw
allow=alaw
allow=g722
; allow=opus  ; Si ACS soporta
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
; SRTP obligatorio para ACS
media_encryption=sdes
media_encryption_optimistic=no

; Identificacion del trunk ACS
[acs-trunk-identify]
type=identify
endpoint=acs-trunk
; IPs de Microsoft PSTN Hub
match=52.112.0.0/14
match=52.120.0.0/14

; AOR para ACS (sin registro, solo para llamadas)
[acs-trunk]
type=aor
max_contacts=1
qualify_frequency=0

; ------------------------------------------------------------------------------
; TRUNK HACIA TWILIO (Elastic SIP Trunking)
; ------------------------------------------------------------------------------
; Twilio usa autenticacion con usuario/password

; Se configura via FreePBX GUI, pero aqui hay un ejemplo:
