; ==============================================================================
; Extensions Custom para PoC SBC Simulado
; ==============================================================================
; Reglas de enrutamiento que simulan los dial-peers de un Cisco CUBE
; ==============================================================================

; ------------------------------------------------------------------------------
; CONTEXTO: Llamadas entrantes desde Azure ACS
; ------------------------------------------------------------------------------
; Cuando ACS hace una llamada saliente, llega aqui y se enruta a PSTN via Twilio

[from-acs]
; Llamadas a numeros de Colombia (+57)
exten => _+57XXXXXXXXXX,1,NoOp(Llamada entrante desde ACS hacia ${EXTEN})
 same => n,Set(CALLERID(num)=${CALLERID(num)})
 same => n,Goto(to-twilio,${EXTEN},1)

; Llamadas a numeros de USA (+1)
exten => _+1XXXXXXXXXX,1,NoOp(Llamada entrante desde ACS hacia ${EXTEN})
 same => n,Goto(to-twilio,${EXTEN},1)

; Cualquier otro numero
exten => _+X.,1,NoOp(Llamada entrante desde ACS hacia ${EXTEN})
 same => n,Goto(to-twilio,${EXTEN},1)

; Llamadas sin prefijo internacional
exten => _XXXXXXXXXX,1,NoOp(Llamada sin prefijo desde ACS: ${EXTEN})
 same => n,Set(DEST=+57${EXTEN})
 same => n,Goto(to-twilio,${DEST},1)

; Handler de error
exten => i,1,NoOp(Extension invalida desde ACS: ${EXTEN})
 same => n,Hangup(1)

; ------------------------------------------------------------------------------
; CONTEXTO: Llamadas entrantes desde Twilio (PSTN)
; ------------------------------------------------------------------------------
; Cuando alguien llama al numero Twilio, se puede enrutar a una extension
; o enviar de vuelta a ACS para que OPTI conteste

[from-twilio]
; Llamadas entrantes al numero Twilio
exten => _X.,1,NoOp(Llamada entrante desde PSTN: ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(CALLERID(name)=PSTN-${CALLERID(num)})
 ; Opcion 1: Enviar a ACS para que OPTI conteste
 ; same => n,Goto(to-acs,${EXTEN},1)
 ; Opcion 2: Reproducir mensaje de prueba
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-congrats)
 same => n,Playback(vm-goodbye)
 same => n,Hangup()

; Handler para DID especifico (tu numero Twilio)
; Reemplaza XXXXXXXXXX con tu numero
exten => _+57XXXXXXXXXX,1,NoOp(Llamada a DID principal)
 same => n,Goto(from-twilio,s,1)

exten => s,1,NoOp(Llamada entrante PSTN - sin DID)
 same => n,Answer()
 same => n,Playback(demo-congrats)
 same => n,Hangup()

; ------------------------------------------------------------------------------
; CONTEXTO: Llamadas salientes hacia Twilio (PSTN)
; ------------------------------------------------------------------------------
; Enruta llamadas hacia la red PSTN a traves de Twilio

[to-twilio]
; Llamadas a Colombia
exten => _+57XXXXXXXXXX,1,NoOp(Saliente a PSTN Colombia: ${EXTEN})
 same => n,Set(CALLERID(num)=${TWILIO_CALLERID:-+573001234567})
 same => n,Dial(PJSIP/${EXTEN}@twilio-trunk,60,T)
 same => n,Hangup()

; Llamadas a USA
exten => _+1XXXXXXXXXX,1,NoOp(Saliente a PSTN USA: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@twilio-trunk,60,T)
 same => n,Hangup()

; Cualquier numero internacional
exten => _+X.,1,NoOp(Saliente a PSTN Internacional: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@twilio-trunk,60,T)
 same => n,Hangup()

; ------------------------------------------------------------------------------
; CONTEXTO: Llamadas salientes hacia Azure ACS
; ------------------------------------------------------------------------------
; Para pruebas donde el SBC llama hacia ACS (menos comun)

[to-acs]
exten => _X.,1,NoOp(Saliente hacia ACS: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@acs-trunk,60,T)
 same => n,Hangup()

; ------------------------------------------------------------------------------
; CONTEXTO: Pruebas internas
; ------------------------------------------------------------------------------

[internal-test]
; Extension de prueba - eco
exten => 600,1,NoOp(Test de eco)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; Extension de prueba - hora
exten => 601,1,NoOp(Test de hora)
 same => n,Answer()
 same => n,SayUnixTime()
 same => n,Hangup()

; Extension de prueba - musica en espera
exten => 602,1,NoOp(Test de musica)
 same => n,Answer()
 same => n,MusicOnHold(default,30)
 same => n,Hangup()
